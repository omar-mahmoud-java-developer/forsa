[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "job-radar-agent"
version = "0.1.0"
description = "Self-hosted job-search agent: finds jobs, scores them against your profile, drafts applications and keeps you in control. Dry-run by default."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "[YOUR NAME OR GITHUB HANDLE]" }]
keywords = ["job-search", "automation", "mcp", "linkedin", "ai-agent", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
# LinkedIn backend: the MCP client and the pinned LinkedIn MCP server (Apache-2.0).
linkedin = [
  "mcp==2.3.0",
  "mcp-server-linkedin==4.29.0; python_full_version >= '3.12.4'",
]
llm = ["anthropic==2.10.0"]
apply = ["patchright==1.64.4"]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[project.urls]
Homepage = "https://github.com/[GITHUB_HANDLE]/job-radar-agent"
Issues = "https://github.com/[GITHUB_HANDLE]/job-radar-agent/issues"
Changelog = "https://github.com/[GITHUB_HANDLE]/job-radar-agent/blob/main/CHANGELOG.md"

[project.scripts]
job-radar = "job_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
extend-exclude = []
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"src/job_radar/apply/browser.py" = ["E501"]
"src/job_radar/dashboard.py" = ["E501"]
"src/job_radar/cli.py" = ["E501"]
"src/job_radar/reach/base.py" = ["E501", "UP", "I"]
"src/job_radar/reach/probe.py" = ["E501", "UP", "I"]
"src/job_radar/reach/process.py" = ["E501", "UP", "I"]
