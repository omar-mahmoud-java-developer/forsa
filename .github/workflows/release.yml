name: release
# Push a tag like v0.1.0. PyPI trusted publishing: no token is stored (see CONTRIBUTING.md).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$ver"
      - run: pip install -e ".[dev]" build && ruff check . && pytest
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
